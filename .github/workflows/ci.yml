name: CI/CD - Testes e Deploy

# Dispara a esteira sempre que houver push ou pull request na branch main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  testes:
    name: Executar Testes Unitários e Integração (CI)
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do seu repositório para o computador do GitHub
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      # 2. Configura a versão correta do Python
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Instala as dependências do projeto e as ferramentas de teste
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      # 4. Roda os testes com pytest
      - name: Executar Pytest
        env:
          APP_ENV: test
          MODEL_VERSION: v1
          API_KEY: chave-ficticia-123
        run: |
          pytest -v

  deploy:
    name: Deploy Contínuo no Render (CD)
    needs: testes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Acionar Deploy Hook do Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Erro: Secret RENDER_DEPLOY_HOOK_URL não encontrado nos Secrets de Actions."
            exit 1
          fi
          curl -fsSL -X POST "$DEPLOY_HOOK"
          echo ""
          echo "Deploy acionado com sucesso no Render!"